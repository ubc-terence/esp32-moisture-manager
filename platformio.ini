[env:esp32-c5-waveshare]
; ESP32-C5 has no official PlatformIO platform support yet (very new chip,
; entered mass production ~April 2025). Using the pioarduino community fork,
; which is the actively-maintained source for C5/C6/H2/P4 support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson @ ^7
