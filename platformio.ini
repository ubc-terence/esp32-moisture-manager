[platformio]
description = ESP32 Moisture Manager: capacitive soil-moisture monitor with a self-hosted Wi-Fi dashboard (ESP32-C5)
; Plain `pio run` builds only the firmware. Diagnostic sketches (env:diag-*) and
; the host-side unit tests (env:native, run with `pio test -e native`) are opt-in.
default_envs = esp32-c5-waveshare

[env:esp32-c5-waveshare]
; ESP32-C5 has no official PlatformIO platform support yet (very new chip,
; entered mass production ~April 2025). Using the pioarduino community fork,
; which is the actively-maintained source for C5/C6/H2/P4 support.
;
; Pinned to release 55.03.311 (Arduino-ESP32 3.3.11) so every collaborator and
; CI builds the same thing; the moving "stable" link can change under you.
; 55.03.312 (Arduino 3.3.12) appeared 2026-09-20 and has NOT been tested here.
;
; KNOWN ISSUE: Arduino-ESP32 3.3.8+ (including 3.3.11) has a
; regression where WiFi.softAP() reports success (valid IP/mode/channel) but
; the AP is never actually visible to clients. Versions before 3.3.8 (tried:
; 3.3.7, 3.3.9) don't have complete ESP32-C5 chip library support and fail
; to build at all. There is currently no published pioarduino release where
; both "C5 works" and "softAP works" are true simultaneously — a genuine
; upstream gap. main.cpp includes a WiFi-reset-before-AP-mode workaround;
; revisit this pin once the regression is fixed upstream or an older
; release gains full C5 support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; NOTE: the prebuilt Arduino C5 libs enable PSRAM, but it does not initialize
; on this board (psramFound() == 0, PSRAM allocations fail) and the boot log
; prints "E MSPI Timing: Failed to allocate dummy cacheline for PSRAM memory
; barrier!". Harmless: this firmware only uses internal RAM (~15% of 320 KB).
; 16MB flash was confirmed with esptool flash-id; whether the module really
; has 8MB PSRAM was NOT verified.
board_build.flash_size = 16MB ; this board is the N16R8 variant (16MB flash / 8MB PSRAM)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson @ ^7

; ---- Diagnostic sketches (tools/diagnostics/*) ----------------------------
; Flashing one of these REPLACES the firmware on the board (NVS calibration and
; the LittleFS history are untouched). Re-flash env:esp32-c5-waveshare after.
;   pio run -e diag-pin-probe -t upload --upload-port <port>
[env:diag-pin-probe]
extends = env:esp32-c5-waveshare
build_src_filter = -<*> +<../tools/diagnostics/pin_probe/>
lib_deps =
; Probe other pins without editing this file:
;   PLATFORMIO_BUILD_FLAGS="-D PROBE_PIN=5 -D POWER_PIN=-1" pio run -e diag-pin-probe -t upload ...
; (POWER_PIN=-1 means the sensor's VCC is wired to 3V3.)

[env:diag-psram-check]
extends = env:esp32-c5-waveshare
build_src_filter = -<*> +<../tools/diagnostics/psram_check/>
lib_deps =
